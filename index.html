<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>FootIQ · Multi-Torneo · BetPlay</title>
<style>
:root{
  --bg:#0b0f16; --bg2:#121824; --card:#161d29; --card2:#1b2331;
  --border:#232d3d; --border2:#2c3849;
  --text:#eaeff7; --muted:#7c8aa0; --dim:#5b6779;
  --accent:#5aa9f0; --accent-soft:rgba(90,169,240,.12);
  --gold:#e3b24d; --gold-soft:rgba(227,178,77,.12);
  --green:#3ecf8e; --green-soft:rgba(62,207,142,.13);
  --red:#f0656f; --red-soft:rgba(240,101,111,.12);
  --orange:#f0934e; --yellow:#e6c34d;
  --shadow:0 6px 20px rgba(0,0,0,.28);
  --r:16px; --r-sm:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{
  background:radial-gradient(120% 80% at 50% 0%,#0e141e 0%,var(--bg) 60%);
  color:var(--text);font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:17px;line-height:1.45;display:flex;flex-direction:column;min-height:100vh;
  max-width:640px;margin:0 auto;position:relative;
  box-shadow:0 0 80px rgba(0,0,0,.45);
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--accent-soft);}
/* scrollbars discretas */
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px;}

/* ===== OVERLAY ===== */
#overlay{position:fixed;inset:0;background:radial-gradient(120% 80% at 50% 30%,#0e141e,var(--bg));z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;}
#overlay.gone{display:none;}
.ov-ball{font-size:52px;animation:float 2.6s ease-in-out infinite;}
.ov-title{font-size:24px;font-weight:800;letter-spacing:-.02em;}
.ov-sub{font-size:16px;color:var(--muted);}
.ov-prog{width:220px;height:4px;background:var(--border);border-radius:99px;overflow:hidden;}
.ov-fill{height:100%;background:linear-gradient(90deg,var(--accent),#8ec7ff);width:0%;transition:width .35s ease;border-radius:99px;}
.ov-step{font-size:14px;color:var(--dim);}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== TOPBAR ===== */
.topbar{display:flex;padding:14px 18px;align-items:center;gap:10px;position:sticky;top:0;z-index:50;
  background:rgba(11,15,22,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.logo{font-size:22px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:baseline;gap:7px;}
.logo em{color:var(--accent);font-style:normal;}
.spacer{flex:1;}
.col-time{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;}
.sync-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--card);cursor:pointer;font-size:17px;border:1px solid var(--border2);transition:.2s;}
.sync-btn:hover{border-color:var(--accent);background:var(--accent-soft);}
.sync-btn.syncing{animation:spin 1s linear infinite;}
.sync-status{font-size:13px;color:var(--muted);}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--dim);transition:.3s;}
.sdot.ok{background:var(--green);box-shadow:0 0 10px var(--green-soft);}

/* ===== TABS ===== */
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:57px;z-index:40;}
.tab{flex:1;text-align:center;padding:11px 2px 9px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;transition:.2s;}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab .ti{font-size:23px;display:block;margin-bottom:2px;filter:grayscale(.3);}
.tab.active .ti{filter:none;}

/* ===== TORNEO BAR ===== */
.torneo-bar{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 8px;scrollbar-width:none;}
.torneo-bar::-webkit-scrollbar{display:none;}
.tpill{padding:8px 15px;border-radius:99px;border:1px solid var(--border2);font-size:14px;font-weight:600;
  cursor:pointer;white-space:nowrap;background:var(--card);color:var(--muted);transition:.2s;}
.tpill:hover{border-color:var(--accent);}
.tpill.active{background:var(--accent);color:#04121f;border-color:var(--accent);font-weight:700;box-shadow:0 3px 12px rgba(90,169,240,.3);}
.tpill.fin{opacity:.6;}

/* ===== PAGES ===== */
.pages{flex:1;overflow:hidden;position:relative;}
.page{position:absolute;inset:0;overflow-y:auto;padding:8px 16px 40px;display:none;}
.page.active{display:block;animation:fadeUp .35s ease;}

/* ===== CARDS ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.stitle{font-size:15px;font-weight:700;letter-spacing:-.01em;margin:20px 2px 10px;display:flex;align-items:center;gap:7px;color:var(--text);}
.trow{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);}
.trow:last-child{border-bottom:none;}
.tname{font-size:17px;font-weight:600;flex:1;}
.tpct{font-size:17px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;}

/* ===== CHAMPION ===== */
.champ-wrap{background:linear-gradient(160deg,#12203a 0%,#0d1826 70%);border:1px solid var(--border2);
  border-radius:20px;padding:30px 22px;text-align:center;margin-bottom:16px;box-shadow:var(--shadow);}
.champ-flag{font-size:52px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4));}
.champ-name{font-size:27px;font-weight:800;letter-spacing:-.02em;margin-top:4px;}
.champ-pct{font-size:44px;font-weight:900;color:var(--gold);letter-spacing:-.03em;margin-top:2px;
  text-shadow:0 3px 18px rgba(227,178,77,.28);font-variant-numeric:tabular-nums;}

/* ===== MATCH CARD ===== */
.mcard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
.match-header{display:flex;align-items:center;gap:8px;padding-bottom:12px;margin-bottom:12px;border-bottom:1px solid var(--border);}
.match-header .tname{font-size:16px;}
.match-meta{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums;}

/* probabilidades */
.probs{display:flex;gap:8px;margin:4px 0 2px;}
.prob{flex:1;text-align:center;background:var(--bg2);border:1px solid transparent;border-radius:var(--r-sm);padding:12px 4px;transition:.2s;}
.pv{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.pl{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.prob.prob-top{background:var(--accent-soft);border-color:rgba(90,169,240,.4);}
.prob.prob-top .pv{color:var(--accent);}

/* resultado final */
.result-real{background:var(--green-soft);border:1px solid rgba(62,207,142,.35);border-radius:var(--r-sm);padding:12px;margin:6px 0 4px;text-align:center;}
.result-real .rscore{font-size:30px;font-weight:900;letter-spacing:1px;font-variant-numeric:tabular-nums;}
.result-real .rlabel{font-size:14px;color:var(--muted);margin-top:2px;font-weight:600;}

/* veredicto / dictamen */
.verdict{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding:12px 14px;border-radius:var(--r-sm);font-size:16px;font-weight:600;}
.verdict b{font-weight:800;}
.verdict.v-pre{background:var(--gold-soft);border:1px solid rgba(227,178,77,.35);color:var(--gold);}
.verdict.v-ok{background:var(--green-soft);border:1px solid rgba(62,207,142,.35);color:var(--green);}
.verdict.v-no{background:var(--red-soft);border:1px solid rgba(240,101,111,.3);color:var(--red);}
.verdict .v-sign{font-size:19px;}
.verdict .v-code{font-size:13px;font-weight:800;background:rgba(255,255,255,.09);padding:3px 9px;border-radius:99px;color:var(--text);}

/* motores por partido */
.motor-res{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--border);font-size:15px;}
.motor-res:last-child{border-bottom:none;}
.motor-line{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.mchip{font-size:13px;font-weight:700;padding:5px 10px;border-radius:99px;white-space:nowrap;}
.mchip-ok{background:var(--green-soft);color:var(--green);}
.mchip-no{background:var(--red-soft);color:var(--red);}
.mchip-abs{background:var(--bg2);color:var(--muted);}

/* tabla compacta motores (legacy, aún usada en comparativa) */
.motor-table{width:100%;border-collapse:collapse;margin-top:6px;}
.motor-table th{padding:5px 6px;font-size:13px;color:var(--muted);font-weight:600;}
.motor-table td{padding:6px;font-size:15px;text-align:center;}
.motor-table td:first-child{text-align:left;font-size:14px;color:var(--muted);white-space:nowrap;}
.mtab{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:10px;}
.mtab th,.mtab td{padding:7px 2px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums;}
.mtab th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
.mtab th:first-child,.mtab td:first-child{text-align:left;width:34%;font-size:13px;color:var(--muted);}
.mtab td:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mtab tbody tr{border-top:1px solid var(--border);}
.mtab .pk{font-weight:800;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;}

/* mejor propuesta */
.bestbet{margin-top:12px;background:var(--gold-soft);border:1px solid rgba(227,178,77,.3);border-radius:var(--r-sm);padding:12px 14px;}
.bestbet .bb-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;}
.bestbet .bb-m{font-size:19px;font-weight:800;color:var(--gold);margin-top:3px;letter-spacing:-.01em;}

/* calibrando */
.calib{background:var(--gold-soft);border:1px solid rgba(227,178,77,.25);border-radius:var(--r-sm);padding:10px 12px;font-size:13px;color:var(--gold);margin-top:10px;line-height:1.5;}

.mkt-panel{margin-top:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:12px 14px;}
.mkt-h{font-size:14px;font-weight:700;margin-bottom:8px;}
.mkt-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:4px 0;color:var(--muted);}
.mkt-row .mkt-v{color:var(--text);font-weight:700;font-variant-numeric:tabular-nums;}
.mkt-value{margin-top:8px;padding:9px 11px;background:var(--green-soft);border:1px solid rgba(62,207,142,.3);border-radius:8px;font-size:14px;color:var(--green);}
.mkt-value b{font-weight:800;}
.mkt-note{font-size:12px;color:var(--muted);margin-top:3px;font-weight:400;}
.fin-badge{display:inline-block;background:var(--border2);color:var(--muted);font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;text-transform:uppercase;letter-spacing:.05em;}
.value-tag{background:var(--green-soft);color:var(--green);font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;margin-left:6px;}

/* ===== TOAST ===== */
.sync-toast{position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--card2);
  border:1px solid var(--border2);border-radius:var(--r-sm);padding:12px 42px 12px 16px;font-size:15px;z-index:9997;
  opacity:0;transition:.3s;max-width:90vw;line-height:1.4;box-shadow:var(--shadow);pointer-events:none;}
.sync-toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.toast-close{position:absolute;top:8px;right:12px;font-size:19px;cursor:pointer;color:var(--muted);}

/* ===== FUTURO ===== */
.future-card{text-align:center;padding:34px 20px;}
.future-icon{font-size:46px;margin-bottom:12px;opacity:.9;}
.future-name{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px;}
.future-date{font-size:16px;color:var(--accent);font-weight:700;}
.future-note{font-size:14px;color:var(--muted);margin-top:12px;line-height:1.6;}

/* ===== STANDINGS ===== */
.standings-table{width:100%;border-collapse:collapse;}
.standings-table th{padding:7px 4px;font-size:12px;color:var(--muted);text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
.standings-table td{padding:9px 4px;font-size:15px;text-align:center;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;}
.standings-table tr:last-child td{border-bottom:none;}
.standings-table td.tn{text-align:left;font-weight:600;font-size:15px;}
</style>
</head>
<body>

<div id="overlay">
  <div class="ov-ball">⚽</div>
  <div class="ov-title">FootIQ · Multi-Torneo</div>
  <div class="ov-sub" id="ovSub">Cargando motores de predicción</div>
  <div style="font-size:15px;color:var(--gold);font-weight:700;margin-top:2px">🗓️ Versión v2.5 · 5-ago-2026 3:28am</div>
  <div class="ov-prog"><div class="ov-fill" id="progFill"></div></div>
  <div class="ov-step" id="stepMsg">Iniciando...</div>
</div>

<div class="topbar">
  <div class="logo">Foot<em>IQ</em> <span style="font-size:13px;opacity:.6;font-weight:600;color:var(--gold)">v2.5 · 5-ago-2026 3:28am</span></div>
  <div class="spacer"></div>
  <span class="col-time" id="colTime">—</span>
  <span class="sync-status" id="syncStatus"></span>
  <div class="sync-btn" id="syncBtn" onclick="syncActive()" title="Sincronizar resultados y cuotas">🔄</div>
  <div class="sdot" id="statusDot"></div>
</div>

<div id="syncToast" class="sync-toast"></div>

<div class="torneo-bar" id="torneoBar"></div>

<div class="tabs">
  <div class="tab active" onclick="showTab(this,'champ')"><span class="ti">🏆</span>Campeón</div>
  <div class="tab" onclick="showTab(this,'hoy')"><span class="ti">📅</span>Partidos</div>
  <div class="tab" onclick="showTab(this,'comp')"><span class="ti">📊</span>Motores</div>
</div>

<div class="pages">
  <div class="page active" id="page-champ"></div>
  <div class="page" id="page-hoy"></div>
  <div class="page" id="page-comp"></div>
</div>

<script>
// ==================== REGISTRO DE TORNEOS ====================
// Fechas verificadas 21-jul-2026 (Dimayor, LaLiga, CONMEBOL, FIFA)
const TORNEOS = {
  betplay: {
    nombre:'Liga BetPlay 2026-II', corto:'🇨🇴 BetPlay', espn:'col.1',
    inicio:'2026-07-24', fin:'2026-12-15', estado:'activo', seedDesde:'2026-01-15', seedHasta:'2026-07-23',
    nota:'20 equipos · 19 fechas todos contra todos (hasta 8 nov) + cuadrangulares. Inicia vie 24 jul. Campeón Apertura 2026-I: Atlético Junior (3-1 global a Nacional).',
    baseDraw:0.28, baseFav:0.46
  },
  laliga: {
    nombre:'LaLiga 2026-27', corto:'🇪🇸 LaLiga', espn:'esp.1',
    inicio:'2026-08-15', fin:'2027-05-30', estado:'activo', seedDesde:'2025-08-10', seedHasta:'2026-06-01',
    nota:'Jornada 1: sáb 15 ago (Alavés–Getafe 19:00). Partidos de equipos con mundialistas pueden aplazarse al 25-27 ago.',
    baseDraw:0.25, baseFav:0.49
  },
  wc2026: {
    nombre:'Mundial 2026', corto:'🏆 WC26', espn:'fifa.world',
    inicio:'2026-06-11', fin:'2026-07-19', estado:'finalizado',
    campeon:{equipo:'España', flag:'🇪🇸', detalle:'1-0 a Argentina en la prórroga (Ferran Torres, min 106)'},
    podio:[['🇪🇸 España','Campeón'],['🇦🇷 Argentina','Subcampeón'],['🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra','3er lugar (6-4 a Francia)']]
  },
  eliminatorias: {
    nombre:'Eliminatorias CONMEBOL 2030', corto:'🌎 Elim. 2030', espn:'fifa.worldq.conmebol',
    inicio:'2027-03-22', estado:'futuro',
    nota:'Previstas para iniciar en la fecha FIFA del 22-30 de marzo de 2027 (pendiente confirmación FIFA). Argentina, Uruguay y Paraguay ya clasificados como anfitriones del centenario.'
  },
  copaamerica: {
    nombre:'Copa América 2028', corto:'🏆 CA 2028', espn:'conmebol.america',
    inicio:'2028-06-20', estado:'futuro',
    nota:'Prevista jun-jul 2028. Sede sin confirmar oficialmente — Ecuador es el principal candidato.'
  },
  wc2030: {
    nombre:'Mundial 2030', corto:'🌍 WC 2030', espn:'fifa.world',
    inicio:'2030-06-01', estado:'futuro',
    nota:'Sedes: España, Portugal y Marruecos + 3 partidos del centenario en Argentina, Uruguay y Paraguay.'
  }
};
let ACTIVE = localStorage.getItem('fiq2_active') || 'betplay';
if(!TORNEOS[ACTIVE]) ACTIVE='betplay';

const _now = new Date();
const todayStr = `${_now.getFullYear()}-${String(_now.getMonth()+1).padStart(2,'0')}-${String(_now.getDate()).padStart(2,'0')}`;

// ==================== ESTADO POR TORNEO ====================
// S[t] = { teams:{id:{name,logo}}, matches:[{id,date,h,a,sh,sa,played,odds:{pH,pD,pA,first:{...}}}] }
let S = {};
function loadState(t){
  if(S[t]) return S[t];
  try{
    const raw=localStorage.getItem('fiq2_'+t);
    if(raw){ S[t]=JSON.parse(raw); return S[t]; }
  }catch(e){}
  S[t]={teams:{},matches:[]};
  return S[t];
}
function saveState(t){ try{ localStorage.setItem('fiq2_'+t, JSON.stringify(S[t])); }catch(e){} }

// ==================== MOTORES (4) ====================
// Todos se evalúan WALK-FORWARD: cada partido se predice solo con datos
// anteriores a ese partido. Nada de autoevaluación con datos del futuro.

// --- Motor 1: ELO ---
function eloProb(rH,rA,baseDraw,hfa){
  const diff=(rH+(hfa||0))-rA;              // hfa = ventaja de local en puntos ELO
  const pW=1/(1+Math.pow(10,-diff/400));
  const draw=Math.max(0.12,Math.min(0.34,(baseDraw??0.26)-Math.abs(diff)*0.00012));
  const pH=pW*(1-draw), pA=(1-pW)*(1-draw);
  return {pH,pD:1-pH-pA,pA};
}
function eloUpdate(elo,h,a,sh,sa,hfa,gp){
  const eh=elo[h]??1500, ea=elo[a]??1500;
  const expH=1/(1+Math.pow(10,(ea-(eh+(hfa||0)))/400));  // expectativa cuenta la localía
  const actH=sh>sa?1:sh===sa?0.5:0;
  const gd=Math.abs(sh-sa);
  const kAdj=gd<=1?1:gd===2?1.5:gd===3?1.75:1.75+0.5*Math.log(gd-2);
  // K provisional: alto con pocos partidos (converge rápido), baja al estabilizarse
  const games=gp?Math.min(gp[h]||0,gp[a]||0):99;
  const Kbase=games<5?54:games<10?38:24;
  const Ke=Math.round(Kbase*kAdj);
  elo[h]=Math.round(eh+Ke*(actH-expH));
  elo[a]=Math.round(ea+Ke*((1-actH)-(1-expH)));
  if(gp){ gp[h]=(gp[h]||0)+1; gp[a]=(gp[a]||0)+1; }
}

// --- Motor 2: Momentum (últimos 5, solo partidos previos) ---
function momProb(fH,fA){
  // fX = {pts,n} de los últimos 5 partidos previos
  if(fH.n<2||fA.n<2) return null; // sin datos suficientes: se abstiene
  const rH=(fH.pts/fH.n)/3, rA=(fA.pts/fA.n)/3;
  const tot=rH+rA;
  const pW=tot>0?rH/tot:0.5;
  const draw=Math.max(0.14,Math.min(0.30,0.30-Math.abs(rH-rA)*0.20));
  const pH=pW*(1-draw), pA=(1-pW)*(1-draw);
  return {pH,pD:1-pH-pA,pA};
}

// --- INTELIGENCIA DE MERCADO (línea de consenso vía DraftKings/ESPN) ---
// Calcula los indicadores que usan los apostadores profesionales:
//  • prob implícita SIN margen (de-vig) = la "línea de consenso / sharp"
//  • margen/overround = cuánto se queda la casa (menor = casa más afinada)
//  • movimiento de línea (opening→closing): si una cuota CAE, entra dinero a ese lado
// Nota honesta: OddsPortal/Betstamp no se pueden leer (JS + términos de uso).
// DraftKings (vía ESPN) es una casa sharp y sirve de referencia de consenso.
const MOVE_LABEL={H:'Local',D:'Empate',A:'Visitante'};
function marketSignals(m){
  const o=m.odds; if(!o||o.pH==null) return null;
  const fair={pH:o.pH,pD:o.pD,pA:o.pA};   // ya viene de-vig (normalizada)
  let move=null, drop=null;
  if(o.first&&o.first.pH!=null){
    move={H:o.pH-o.first.pH, D:o.pD-o.first.pD, A:o.pA-o.first.pA};
    // "dropping odds": el lado cuya prob implícita SUBIÓ = su cuota cayó = dinero/sharp entrando
    const arr=[['H',move.H],['D',move.D],['A',move.A]].sort((x,y)=>y[1]-x[1]);
    if(arr[0][1]>=0.025) drop=arr[0][0];
  }
  return {fair, move, drop, margin:o.margin??null};
}
// Motor Mercado: parte de la línea de consenso (de-vig) y sigue el movimiento (sharp money).
function mercadoProb(m){
  const sig=marketSignals(m);
  if(!sig) return null;
  let {pH,pD,pA}=sig.fair;
  if(sig.move){
    // El cierre es más afinado que la apertura → inclinar hacia donde se movió la línea.
    const k=0.6;
    pH=Math.max(0.02,pH+sig.move.H*k);
    pA=Math.max(0.02,pA+sig.move.A*k);
    pD=Math.max(0.05,1-pH-pA);
  }
  const s=pH+pD+pA;
  return {pH:pH/s,pD:pD/s,pA:pA/s};
}

// --- Motor 3: 🌀 ANOMALÍA — el clon de la casa (EXPERIMENTO DE SOBREAJUSTE) ---
// Fusiona el mercado de apuestas y el análisis de anomalías en UN motor:
// Paso 1 (hecho): entrenado sobre los 104 partidos del Mundial 2026 hasta el
// 100% de acierto (capa SGD 76.9% + memoria residual de 24 partidos).
// 74 parámetros para 104 partidos = sobreajuste deliberado.
// Paso 2 (en curso): se aplica a partidos FUTUROS (BetPlay/LaLiga) para medir
// si "el clon de la casa" transfiere o colapsa. Su precisión real se acumula
// walk-forward en la pestaña Motores. Hipótesis nula: colapsa a ~ELO o peor.
const ANOM_MODEL={"meta": {"scale": 1, "cut": 1.2716, "entrenado": "WC2026", "partidos": 104, "accCapa1": 76.9, "accFinal": 100}, "ratings": {"Mexico": 2.186, "South Africa": -4.061, "South Korea": -4.956, "Czechia": -5.965, "Canada": -0.709, "Bosnia": -0.838, "United States": 1.06, "Paraguay": 0.184, "Qatar": -2.342, "Switzerland": 2.207, "Brazil": 1.058, "Morocco": 1.253, "Haiti": -7.511, "Scotland": -3.208, "Australia": 0.69, "Turkey": -0.347, "Germany": -0.473, "Curaçao": -3.076, "Ivory Coast": -0.75, "Ecuador": -1.505, "Netherlands": 0.578, "Japan": -1.069, "Sweden": -1.793, "Tunisia": -6.716, "Spain": 8.967, "Cape Verde": 5.895, "Belgium": 2.643, "Egypt": 1.891, "Saudi Arabia": 5.332, "Uruguay": 5.332, "Iran": 1.447, "New Zealand": -0.203, "France": 4.39, "Senegal": -2.373, "Iraq": -6.955, "Norway": 2.653, "Argentina": 7.909, "Algeria": -1.725, "Austria": -1.646, "Jordan": -6.664, "Portugal": 3.804, "DR Congo": 2.145, "England": 5.489, "Croatia": 2.36, "Ghana": 1.424, "Panama": -5.249, "Uzbekistan": -4.736, "Colombia": 3.975}, "memoria": {"South Korea|Czechia": "H", "United States|Paraguay": "H", "Qatar|Switzerland": "D", "Australia|Turkey": "H", "Ivory Coast|Ecuador": "H", "Netherlands|Japan": "D", "Spain|Cape Verde": "D", "Iran|New Zealand": "D", "Portugal|DR Congo": "D", "Czechia|South Africa": "D", "United States|Australia": "H", "Turkey|Paraguay": "A", "Germany|Ivory Coast": "H", "Ecuador|Curaçao": "D", "Belgium|Iran": "D", "England|Ghana": "D", "South Africa|South Korea": "H", "Ecuador|Germany": "H", "Turkey|United States": "H", "Croatia|Ghana": "H", "Australia|Egypt": "D", "Switzerland|Colombia": "D", "France|England": "A", "Spain|Argentina": "H"}};
function _casaSig(x){return 1/(1+Math.exp(-x));}
// Modo A (equipos del Mundial): modelo completo con memoria — 100% en entrenamiento
function _anomWC(h,a){
  const R=ANOM_MODEL.ratings;
  if(R[h]==null||R[a]==null) return null;
  const memo=ANOM_MODEL.memoria[h+'|'+a];
  if(memo) return memo==='H'?{pH:0.90,pD:0.06,pA:0.04}:memo==='A'?{pH:0.04,pD:0.06,pA:0.90}:{pH:0.05,pD:0.90,pA:0.05};
  const z=(R[h]-R[a])*ANOM_MODEL.meta.scale, cut=ANOM_MODEL.meta.cut;
  let pH=_casaSig(z-cut), pA=_casaSig(-z-cut), pD=Math.max(0.02,1-pH-pA);
  const s=pH+pD+pA; return {pH:pH/s,pD:pD/s,pA:pA/s};
}
// Modo B (transferencia a ligas nuevas): solo la parte meta aprendida del WC
// (escala + banda de empate) aplicada al ELO walk-forward de la liga. norm=40 fijo.
function _anomMeta(rH,rA,hfa){
  const z=((rH+(hfa||0))-rA)/40*ANOM_MODEL.meta.scale, cut=ANOM_MODEL.meta.cut;
  let pH=_casaSig(z-cut), pA=_casaSig(-z-cut), pD=Math.max(0.02,1-pH-pA);
  const s=pH+pD+pA; return {pH:pH/s,pD:pD/s,pA:pA/s};
}

// Motor unificado: (a) equipos del Mundial → modelo completo con memoria (100% entrenamiento);
// (b) ligas nuevas CON cuotas → la cuota real de la casa manda (70%) + reglas WC (30%);
// (c) ligas nuevas SIN cuotas → solo las reglas aprendidas del WC sobre el ELO de la liga.
function anomaliaProb(m,rH,rA,hfa){
  const full=_anomWC(m.h,m.a);
  if(full) return full;
  const meta=_anomMeta(rH,rA,hfa);
  const mk=mercadoProb(m);
  if(mk){
    let pH=mk.pH*0.7+meta.pH*0.3, pD=mk.pD*0.7+meta.pD*0.3, pA=mk.pA*0.7+meta.pA*0.3;
    const t=pH+pD+pA; return {pH:pH/t,pD:pD/t,pA:pA/t};
  }
  return meta;
}

const MOTORES=['elo','mom','anomalia'];
const MOTOR_LBL={elo:'⚡ ELO',mom:'🔥 Momentum',anomalia:'🌀 Anomalía'};
const MOTOR_SHORT={elo:'⚡',mom:'🔥',anomalia:'🌀'};
// Sugerencia de apuesta a partir de probabilidades 1X2
function betSuggest(p){
  if(!p) return null;
  const {pH,pD,pA}=p, top=Math.max(pH,pD,pA);
  const pick=top===pH?'H':top===pA?'A':'D';
  if(top>=0.50) return pick==='H'?{code:'1',txt:'Gana local'}:pick==='A'?{code:'2',txt:'Gana visitante'}:{code:'X',txt:'Empate'};
  const low=Math.min(pH,pD,pA);
  if(low===pA) return {code:'1X',txt:'Local o empate'};
  if(low===pH) return {code:'X2',txt:'Empate o visitante'};
  return {code:'12',txt:'Local o visitante'};
}
function brierOf(p,actual){ // 0=perfecto, 2=peor
  return Math.pow(p.pH-(actual==='H'?1:0),2)+Math.pow(p.pD-(actual==='D'?1:0),2)+Math.pow(p.pA-(actual==='A'?1:0),2);
}

// ==================== PASADA WALK-FORWARD ====================
// Una sola pasada cronológica por torneo:
//  - antes de cada partido jugado: registra la predicción de cada motor (estado previo)
//  - después: actualiza ELO, forma, anomalía
// Devuelve: estado final (para predecir futuros), aciertos por motor, pesos honestos.
function argMax3(p){ return (p.pH>=p.pA&&p.pH>=p.pD)?'H':(p.pA>=p.pH&&p.pA>=p.pD)?'A':'D'; }

function walkForward(t){
  const st=loadState(t);
  const cfg=TORNEOS[t];
  const elo={}; const form={}; const gp={};      // gp = partidos jugados por equipo
  const anom={favW:0,favN:0,draws:0,n:0};
  // Aprendizaje de parámetros de la liga (localía y empates), estimados sobre la marcha
  let hw=0,aw=0,dr=0,ntot=0;
  const learnHFA=()=>{ if(ntot<12) return 55; const r=(hw+0.5*dr)/Math.max(1,(aw+0.5*dr)); return Math.max(0,Math.min(150,Math.round(400*Math.log10(Math.max(0.2,r))))); };
  const learnDraw=()=>{ if(ntot<12) return cfg.baseDraw; return Math.max(0.14,Math.min(0.36,dr/ntot)); };
  const accResult=(sh,sa)=>{ if(sh>sa)hw++; else if(sa>sh)aw++; else dr++; ntot++; };
  const hits={},tot={},log=[]; const brier={},mkt={hits:0,tot:0,brier:0};
  MOTORES.forEach(m=>{hits[m]=0;tot[m]=0;brier[m]=0;});
  const played=st.matches.filter(m=>m.played).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let scored=0; let hfa=55, drawRate=cfg.baseDraw;
  for(const m of played){
    hfa=learnHFA(); drawRate=learnDraw();
    if(m.seed){
      eloUpdate(elo,m.h,m.a,m.sh,m.sa,hfa,gp);
      (form[m.h]=form[m.h]||[]).push(m.sh>m.sa?3:m.sh===m.sa?1:0);
      (form[m.a]=form[m.a]||[]).push(m.sa>m.sh?3:m.sh===m.sa?1:0);
      accResult(m.sh,m.sa);
      continue;
    }
    scored++;
    const rH=elo[m.h]??1500, rA=elo[m.a]??1500;
    const f5=team=>{const arr=(form[team]||[]).slice(-5);return {pts:arr.reduce((s,x)=>s+x,0),n:arr.length};};
    const preds={
      elo: eloProb(rH,rA,drawRate,hfa),
      mom: momProb(f5(m.h),f5(m.a)),
      anomalia: anomaliaProb(m,rH,rA,hfa)
    };
    const actual=m.sh>m.sa?'H':m.sh<m.sa?'A':'D';
    const row={id:m.id,h:m.h,a:m.a,sh:m.sh,sa:m.sa,date:m.date,res:{},picks:{}};
    // Dictamen del consenso con los pesos APRENDIDOS HASTA AQUÍ (honesto, sin mirar el futuro)
    const rw=_calcWeights(hits,tot,scored-1);
    let cH=0,cD=0,cA=0,cws=0;
    for(const k of MOTORES){ if(!preds[k])continue; const wk=rw[k]||0; cH+=preds[k].pH*wk;cD+=preds[k].pD*wk;cA+=preds[k].pA*wk;cws+=wk; }
    if(cws<=0){ const e=preds.elo; cH=e.pH;cD=e.pD;cA=e.pA;cws=1; }
    row.dict=argMax3({pH:cH/cws,pD:cD/cws,pA:cA/cws}); row.dictOk=row.dict===actual;
    for(const k of MOTORES){
      if(!preds[k]) { row.res[k]=null; row.picks[k]=null; continue; }
      tot[k]++;
      const pk=argMax3(preds[k]);
      const ok=pk===actual;
      if(ok) hits[k]++;
      brier[k]+=brierOf(preds[k],actual);
      row.res[k]=ok; row.picks[k]=pk;
    }
    // Mercado como rival: usa la cuota real de la casa si existía
    const mk=mercadoProb(m);
    if(mk){ mkt.tot++; if(argMax3(mk)===actual) mkt.hits++; mkt.brier+=brierOf(mk,actual); row.mkt=argMax3(mk)===actual; }
    else row.mkt=null;
    log.push(row);
    // actualizar estado con el resultado
    const favIsH=rH>=rA;
    if(m.sh!==m.sa){ anom.favN++; if((m.sh>m.sa)===favIsH) anom.favW++; }
    else anom.draws++;
    anom.n++;
    eloUpdate(elo,m.h,m.a,m.sh,m.sa,hfa,gp);
    (form[m.h]=form[m.h]||[]).push(m.sh>m.sa?3:m.sh===m.sa?1:0);
    (form[m.a]=form[m.a]||[]).push(m.sa>m.sh?3:m.sh===m.sa?1:0);
    accResult(m.sh,m.sa);
  }
  const w=_calcWeights(hits,tot,scored);
  return {elo,form,gp,anom,hits,tot,brier,mkt,weights:w,hfa,drawRate,log,playedCount:scored,seedCount:played.length-scored};
}
// Pesos del consenso: reaccionan desde 5 partidos, con encogimiento hacia el
// reparto igual al principio (evita saltos bruscos con pocos datos).
function _calcWeights(hits,tot,scored){
  const base=0.40, floor=0.02; const raw={}; let sum=0; let active=0;
  for(const k of MOTORES){ const n=tot[k]; if(n>0)active++; raw[k]=n>=5?Math.max(floor,(hits[k]/n)-base):0; sum+=raw[k]; }
  const conf=Math.min(1,(scored||0)/25);
  const eq=active>0?1/active:0;
  const w={};
  for(const k of MOTORES){
    const learned = sum>0?raw[k]/sum:(k==='elo'?1:0);
    const equal = tot[k]>0?eq:0;
    w[k]= conf*learned + (1-conf)*equal;
  }
  const wsum=Object.values(w).reduce((a,b)=>a+b,0)||1;
  for(const k in w) w[k]/=wsum;
  return w;
}

let WF={}; // cache por torneo
function getWF(t){ if(!WF[t]) WF[t]=walkForward(t); return WF[t]; }
function invalidateWF(t){ delete WF[t]; }

// ==================== PREDICCIÓN DE PARTIDOS FUTUROS ====================
function predictMatch(t,m){
  const wf=getWF(t);
  const cfg=TORNEOS[t];
  const rH=wf.elo[m.h]??1500, rA=wf.elo[m.a]??1500;
  const hfa=wf.hfa??55, drawRate=wf.drawRate??cfg.baseDraw;
  const f5=team=>{const arr=(wf.form[team]||[]).slice(-5);return {pts:arr.reduce((s,x)=>s+x,0),n:arr.length};};
  const preds={
    elo: eloProb(rH,rA,drawRate,hfa),
    mom: momProb(f5(m.h),f5(m.a)),
    anomalia: anomaliaProb(m,rH,rA,hfa)
  };
  // consenso: pesos walk-forward, renormalizados entre motores CON datos
  let pH=0,pD=0,pA=0,ws=0;
  for(const k of MOTORES){
    if(!preds[k]) continue;
    const w=wf.weights[k]||0;
    pH+=preds[k].pH*w; pD+=preds[k].pD*w; pA+=preds[k].pA*w; ws+=w;
  }
  if(ws<=0){ const e=preds.elo; pH=e.pH;pD=e.pD;pA=e.pA; ws=1; }
  pH/=ws;pD/=ws;pA/=ws;
  const s=pH+pD+pA;
  return {pH:pH/s,pD:pD/s,pA:pA/s,preds,calibrando:wf.playedCount<10};
}

async function fetchJSON(url,timeoutMs=9000){
  const ctrl=new AbortController();
  const tid=setTimeout(()=>ctrl.abort(),timeoutMs);
  try{
    const r=await fetch(url,{signal:ctrl.signal});
    clearTimeout(tid);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){ clearTimeout(tid); throw e; }
}
async function fetchWithProxies(url){
  const enc=encodeURIComponent(url);
  const tries=[
    ()=>fetchJSON(url,6000),
    ()=>fetchJSON('https://api.allorigins.win/raw?url='+enc,12000),
    async()=>{const w=await fetchJSON('https://api.allorigins.win/get?url='+enc,12000);return JSON.parse(w.contents);},
    ()=>fetchJSON('https://api.codetabs.com/v1/proxy/?quest='+enc,12000),
  ];
  let lastErr;
  for(const f of tries){ try{ return await f(); }catch(e){ lastErr=e; } }
  throw lastErr||new Error('sin conexión');
}
function _fmtD(d){ return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }

// Cuotas americanas/decimales → prob implícita normalizada
function oddsToProbs(oddsObj){
  try{
    // ESPN soccer: odds[0] con moneylineHome/Draw/Away (americanas) o
    // homeTeamOdds.moneyLine / drawOdds.moneyLine / awayTeamOdds.moneyLine
    const o=oddsObj;
    const am=v=>{ v=parseFloat(v); if(isNaN(v))return null; return v>0?100/(v+100):(-v)/(-v+100); };
    let h=am(o.moneylineHome ?? o.homeTeamOdds?.moneyLine);
    let d=am(o.moneylineDraw ?? o.drawOdds?.moneyLine);
    let a=am(o.moneylineAway ?? o.awayTeamOdds?.moneyLine);
    if(h==null||d==null||a==null) return null;
    const s=h+d+a;                 // s>1 por el margen (overround) de la casa
    return {pH:h/s,pD:d/s,pA:a/s, margin:+(s-1).toFixed(4)};  // margin = cuánto se queda la casa
  }catch(e){ return null; }
}

function parseEvents(t,events,isSeed){
  const st=loadState(t);
  const byId={}; st.matches.forEach(m=>byId[m.id]=m);
  let nuevos=0,actualizados=0;
  for(const ev of (events||[])){
    const comp=ev.competitions?.[0]; if(!comp) continue;
    const home=comp.competitors?.find(c=>c.homeAway==='home');
    const away=comp.competitors?.find(c=>c.homeAway==='away');
    if(!home||!away) continue;
    const hName=home.team?.displayName||home.team?.shortDisplayName;
    const aName=away.team?.displayName||away.team?.shortDisplayName;
    if(!hName||!aName) continue;
    st.teams[hName]={name:hName};
    st.teams[aName]={name:aName};
    const id=ev.id||hName+'|'+aName+'|'+(ev.date||'');
    const status=comp.status?.type?.name||'';
    const done=comp.status?.type?.completed===true||['STATUS_FINAL','STATUS_FULL_TIME','STATUS_FINAL_PEN','STATUS_FINAL_AET'].includes(status);
    let m=byId[id];
    if(!m){ m={id,h:hName,a:aName,sh:null,sa:null,played:false,odds:null}; if(isSeed)m.seed=true; st.matches.push(m); byId[id]=m; nuevos++; }
    m.date=(ev.date||'').slice(0,16); // ISO con hora
    if(done){
      const sh=parseInt(home.score??'-1'), sa=parseInt(away.score??'-1');
      if(!isNaN(sh)&&sh>=0&&!isNaN(sa)){ if(!m.played)actualizados++; m.sh=sh; m.sa=sa; m.played=true; }
    }
    // Capturar cuotas (capa Mercado): primera vista + última vista
    const rawOdds=comp.odds?.[0];
    if(rawOdds&&!done){
      const p=oddsToProbs(rawOdds);
      if(p){
        if(!m.odds) m.odds={...p,first:{...p}};
        else { if(!m.odds.first) m.odds.first={pH:m.odds.pH,pD:m.odds.pD,pA:m.odds.pA}; Object.assign(m.odds,p); }
      }
    }
  }
  saveState(t);
  return {nuevos,actualizados};
}

async function syncTorneo(t){
  const cfg=TORNEOS[t];
  if(!cfg||cfg.estado==='futuro'||cfg.estado==='finalizado') return {nuevos:0,actualizados:0};
  const base=`https://site.api.espn.com/apis/site/v2/sports/soccer/${cfg.espn}/scoreboard`;
  const st0=loadState(t);
  // Siembra (una sola vez): historia previa para calibrar el ELO antes de la jornada 1
  if(cfg.seedDesde && !st0.seedDone){
    try{
      const s0=new Date(cfg.seedDesde+'T00:00:00'), s1=new Date(cfg.seedHasta+'T00:00:00');
      const sd=await fetchWithProxies(`${base}?dates=${_fmtD(s0)}-${_fmtD(s1)}&limit=500`);
      parseEvents(t,sd.events||[],true);
      st0.seedDone=true; saveState(t);
    }catch(e){ console.warn('seed:',e.message); }
  }
  // Temporada completa: calendario entero para poder simular el título
  const d0=new Date(cfg.inicio+'T00:00:00');
  const d1=cfg.fin?new Date(cfg.fin+'T00:00:00'):(()=>{const x=new Date();x.setDate(x.getDate()+30);return x;})();
  const rng=`${_fmtD(d0)}-${_fmtD(d1)}`;
  const data=await fetchWithProxies(`${base}?dates=${rng}&limit=500`);
  const res=parseEvents(t,data.events||[]);
  invalidateWF(t);
  return res;
}

  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('page-'+name).classList.add('active');
  if(name==='champ') renderChamp();
  else if(name==='hoy') renderHoy();
  else if(name==='comp') renderComparativa();
}
function refreshAll(){
  try{
    const active=document.querySelector('.page.active');
    const id=active?active.id.replace('page-',''):'champ';
    if(id==='champ') renderChamp();
    else if(id==='hoy') renderHoy();
    else if(id==='comp') renderComparativa();
  }catch(e){ console.warn('refreshAll:',e); }
}

// ==================== TABLA DE POSICIONES ====================
function computeStandings(t){
  const st=loadState(t);
  const tbl={};
  for(const m of st.matches){
    if(!m.played||m.seed) continue;
    tbl[m.h]=tbl[m.h]||{pts:0,pj:0,gf:0,gc:0};
    tbl[m.a]=tbl[m.a]||{pts:0,pj:0,gf:0,gc:0};
    tbl[m.h].pj++; tbl[m.a].pj++;
    tbl[m.h].gf+=m.sh; tbl[m.h].gc+=m.sa;
    tbl[m.a].gf+=m.sa; tbl[m.a].gc+=m.sh;
    if(m.sh>m.sa) tbl[m.h].pts+=3;
    else if(m.sh<m.sa) tbl[m.a].pts+=3;
    else { tbl[m.h].pts++; tbl[m.a].pts++; }
  }
  return Object.entries(tbl).map(([team,s])=>({team,...s,dg:s.gf-s.gc}))
    .sort((a,b)=>b.pts-a.pts||b.dg-a.dg||b.gf-a.gf);
}

// ==================== MONTE CARLO TÍTULO (fase regular) ====================
function simTitle(t,N=300){
  const st=loadState(t);
  const pend=st.matches.filter(m=>!m.played&&!m.seed);
  const stand=computeStandings(t);
  if(!stand.length||!pend.length) return null;
  const basePts={}; stand.forEach(s=>basePts[s.team]=s.pts);
  Object.keys(loadState(t).teams).forEach(tm=>{ if(basePts[tm]==null) basePts[tm]=0; });
  const preds=pend.map(m=>({m,p:predictMatch(t,m)}));
  const wins={};
  for(let i=0;i<N;i++){
    const pts={...basePts};
    for(const {m,p} of preds){
      const r=Math.random();
      if(r<p.pH) pts[m.h]=(pts[m.h]||0)+3;
      else if(r<p.pH+p.pD){ pts[m.h]=(pts[m.h]||0)+1; pts[m.a]=(pts[m.a]||0)+1; }
      else pts[m.a]=(pts[m.a]||0)+3;
    }
    let best=null,bp=-1;
    for(const [tm,v] of Object.entries(pts)) if(v>bp){bp=v;best=tm;}
    wins[best]=(wins[best]||0)+1;
  }
  return Object.entries(wins).map(([team,w])=>({team,p:+(w/N*100).toFixed(1)}))
    .sort((a,b)=>b.p-a.p);
}

// ==================== RENDER PARTIDOS ====================
function renderHoy(){
  const pg=document.getElementById('page-hoy');
  const cfg=TORNEOS[ACTIVE];
  if(cfg.estado==='finalizado'){
    pg.innerHTML=`<div class="card future-card"><div class="future-icon">🏁</div><div class="future-name">${cfg.nombre} finalizó</div><div class="future-note">Campeón: ${cfg.campeon.flag} ${cfg.campeon.equipo} — ${cfg.campeon.detalle}</div></div>`;
    return;
  }
  if(cfg.estado==='futuro'){ renderChamp(); pg.innerHTML=document.getElementById('page-champ').innerHTML; return; }
  const st=loadState(ACTIVE);
  if(!st.matches.length){
    pg.innerHTML=`<div class="card future-card"><div class="future-icon">📥</div><div class="future-note">Sin calendario aún. Toca 🔄 para sincronizar ${cfg.nombre}.</div></div>`;
    return;
  }
  const now=new Date();
  const from=new Date(now); from.setDate(from.getDate()-2);
  const to=new Date(now); to.setDate(to.getDate()+7);
  const win=st.matches.filter(m=>{
    if(m.seed) return false;
    const d=new Date(m.date); return !isNaN(d)&&d>=from&&d<=to;
  }).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  if(!win.length){
    pg.innerHTML='<div class="card future-card"><div class="future-icon">📭</div><div class="future-note">Sin partidos entre ayer y los próximos 7 días.</div></div>';
    return;
  }
  const wf=getWF(ACTIVE); const logById={}; wf.log.forEach(r=>logById[r.id]=r);
  let h='',lastDay='';
  const fmtDay=iso=>{ const d=new Date(iso); return d.toLocaleDateString('es-CO',{weekday:'short',day:'numeric',month:'short'}); };
  const fmtHr=iso=>{ const d=new Date(iso); return d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}); };
  const nm=(t,who)=>{const s=t.split(' ')[0]; return who==='H'?s:who==='A'?s:'Empate';};
  const pickLabel=(pk,hh,aa)=> pk==='H'?'Gana '+hh : pk==='A'?'Gana '+aa : 'Empate';
  for(const m of win){
    const day=(m.date||'').slice(0,10);
    if(day!==lastDay){ lastDay=day; h+=`<div class="stitle">📅 ${fmtDay(m.date)}</div>`; }
    const hShort=m.h.split(' ')[0], aShort=m.a.split(' ')[0];
    h+='<div class="mcard">';
    h+=`<div class="match-header"><div class="tname">${m.h}</div><div style="font-size:15px;font-weight:900;padding:0 4px">vs</div><div class="tname" style="text-align:right">${m.a}</div><div class="match-meta">${m.played?'<span class=\'fin-badge\'>Finalizada</span>':fmtHr(m.date)}</div></div>`;
    if(m.played){
      const actual=m.sh>m.sa?'H':m.sh<m.sa?'A':'D';
      const winner=actual==='H'?m.h:actual==='A'?m.a:'Empate';
      h+=`<div class="result-real"><div class="rscore">${m.sh} — ${m.sa}</div><div class="rlabel">${actual==='D'?'Empate':'Ganó '+winner}</div></div>`;
      const row=logById[m.id];
      if(row&&row.picks){
        // Dictamen comprometido ANTES del partido vs resultado
        if(row.dict!=null){
          const okD=row.dictOk;
          h+=`<div class="verdict ${okD?'v-ok':'v-no'}"><span>🔮 Dictamen: <b>${pickLabel(row.dict,hShort,aShort)}</b></span><span class="v-sign">${okD?'✅':'❌'}</span></div>`;
        }
        // Motores en una línea compacta con signos
        h+='<div class="motor-line">';
        for(const k of MOTORES){
          const pk=row.picks[k];
          if(pk==null){ h+=`<span class="mchip mchip-abs">${MOTOR_SHORT[k]} –</span>`; continue; }
          const short=pk==='H'?hShort:pk==='A'?aShort:'X';
          h+=`<span class="mchip ${row.res[k]?'mchip-ok':'mchip-no'}">${MOTOR_SHORT[k]} ${short} ${row.res[k]?'✅':'❌'}</span>`;
        }
        if(row.mkt!=null) h+=`<span class="mchip ${row.mkt?'mchip-ok':'mchip-no'}">🏛️ ${row.mkt?'✅':'❌'}</span>`;
        h+='</div>';
      }
    } else {
      const p=predictMatch(ACTIVE,m);
      const dictP=argMax3(p);
      const conf=Math.round(Math.max(p.pH,p.pD,p.pA)*100);
      h+=`<div class="probs">
        <div class="prob ${dictP==='H'?'prob-top':''}"><div class="pv">${Math.round(p.pH*100)}%</div><div class="pl">${hShort}</div></div>
        <div class="prob ${dictP==='D'?'prob-top':''}"><div class="pv">${Math.round(p.pD*100)}%</div><div class="pl">Emp</div></div>
        <div class="prob ${dictP==='A'?'prob-top':''}"><div class="pv">${Math.round(p.pA*100)}%</div><div class="pl">${aShort}</div></div>
      </div>`;
      const bb=betSuggest(p);
      h+=`<div class="verdict v-pre"><span>🔮 Dictamen: <b>${pickLabel(dictP,hShort,aShort)}</b></span><span class="v-code">${bb.code} · ${conf}%</span></div>`;
      // Cada motor se juega su pick explícito
      h+='<div style="margin-top:6px">';
      for(const k of MOTORES){
        const mp=p.preds[k];
        if(!mp){ h+=`<div class="motor-res"><span>${MOTOR_LBL[k]}</span><span style="color:var(--muted);font-size:13px">se abstiene</span></div>`; continue; }
        const pk=argMax3(mp), pc=Math.round(Math.max(mp.pH,mp.pD,mp.pA)*100);
        h+=`<div class="motor-res"><span>${MOTOR_LBL[k]}</span><span style="font-weight:700">${pickLabel(pk,hShort,aShort)} <span style="color:var(--muted);font-weight:500;font-size:13px">${pc}%</span></span></div>`;
      }
      h+='</div>';
      // ===== Panel de INTELIGENCIA DE MERCADO =====
      const sig=marketSignals(m);
      const mk=mercadoProb(m);
      if(sig){
        h+='<div class="mkt-panel">';
        h+='<div class="mkt-h">🏦 Señales del mercado <span style="color:var(--dim);font-weight:500">· consenso DraftKings</span></div>';
        // prob implícita (de-vig)
        h+=`<div class="mkt-row"><span>Prob. implícita (sin margen)</span><span class="mkt-v">${Math.round(sig.fair.pH*100)}·${Math.round(sig.fair.pD*100)}·${Math.round(sig.fair.pA*100)}</span></div>`;
        // margen / overround
        if(sig.margin!=null){
          const mg=Math.round(sig.margin*100);
          const q=mg<=6?'afinada':mg<=10?'normal':'cara';
          h+=`<div class="mkt-row"><span>Margen de la casa</span><span class="mkt-v">${mg}% <span style="color:var(--dim);font-weight:500">(${q})</span></span></div>`;
        }
        // movimiento de línea (dropping odds)
        if(sig.drop){
          h+=`<div class="mkt-row"><span>📉 Cae la cuota: <b>${MOVE_LABEL[sig.drop]}</b></span><span class="mkt-v" style="color:var(--gold)">entra dinero</span></div>`;
        } else if(sig.move){
          h+=`<div class="mkt-row"><span>Movimiento de línea</span><span class="mkt-v" style="color:var(--dim)">estable</span></div>`;
        }
        // valor vs consenso
        if(mk){
          const cand=[['1','Local',p.pH-mk.pH,p.pH,mk.pH],['X','Empate',p.pD-mk.pD,p.pD,mk.pD],['2','Visitante',p.pA-mk.pA,p.pA,mk.pA]].sort((a,b)=>b[2]-a[2])[0];
          if(cand[2]>=0.08&&cand[3]>=0.30){
            h+=`<div class="mkt-value">💎 Valor en <b>${cand[1]}</b>: modelo ${Math.round(cand[3]*100)}% vs consenso ${Math.round(cand[4]*100)}% <b>(+${Math.round(cand[2]*100)} pts)</b><div class="mkt-note">Solo si tu casa paga por encima de la cuota justa ${(1/cand[3]).toFixed(2)}. No es garantía.</div></div>`;
          } else {
            h+=`<div class="mkt-row"><span>Valor vs consenso</span><span class="mkt-v" style="color:var(--dim)">sin ventaja clara</span></div>`;
          }
        }
        h+='</div>';
      } else {
        h+=`<div style="font-size:12px;color:var(--muted);margin-top:8px">Sin cuotas de la casa aún — las señales de mercado aparecen cuando ESPN publique las cuotas (normalmente 1-2 días antes).</div>`;
      }
      if(p.calibrando) h+='<div class="calib">⚠️ Calibrando: pocos partidos en este torneo. La confianza sube a medida que aprende.</div>';
    }
    h+='</div>';
  }
  pg.innerHTML=h;
}

// ==================== RENDER MOTORES (comparativa walk-forward) ====================
function renderComparativa(){
  const pg=document.getElementById('page-comp');
  const cfg=TORNEOS[ACTIVE];
  if(cfg.estado!=='activo'){
    pg.innerHTML=`<div class="card future-card"><div class="future-note">La comparativa de motores aplica a torneos en juego. ${cfg.estado==='finalizado'?'Este torneo ya terminó.':'Este torneo no ha empezado.'}</div></div>`;
    return;
  }
  const wf=getWF(ACTIVE);
  if(!wf.playedCount){
    const seedNote=wf.seedCount?`<br><br>✅ ELO ya calibrado con <b>${wf.seedCount}</b> partidos de historia previa (Apertura / temporada pasada) — por eso las predicciones ya distinguen a los equipos.`:'';
    pg.innerHTML='<div class="card future-card"><div class="future-icon">📊</div><div class="future-note">Aún no hay partidos jugados en este torneo. La precisión de cada motor aparecerá aquí, medida SOLO con predicciones hechas antes de cada partido (walk-forward, sin trampa estadística).'+seedNote+'</div></div>';
    return;
  }
  let h='<div class="card" style="background:rgba(47,168,245,.07);border-color:rgba(47,168,245,.25);font-size:15px;line-height:1.5">'+
    '🔬 <b>Evaluación honesta (walk-forward):</b> cada motor se califica solo con lo que sabía ANTES de cada partido. Nada de autoevaluarse con datos del futuro (el bug que inflaba el 85% en la versión anterior).</div>';
  const ranked=MOTORES.map(k=>({k,acc:wf.tot[k]?wf.hits[k]/wf.tot[k]:null})).sort((a,b)=>(b.acc??-1)-(a.acc??-1));
  h+='<div class="stitle">🏅 Precisión real · '+wf.playedCount+' partidos</div>';
  ranked.forEach((r,i)=>{
    const medal=['🥇','🥈','🥉','4️⃣'][i];
    const accS=r.acc==null?'—':(r.acc*100).toFixed(1)+'%';
    const w=Math.round((wf.weights[r.k]||0)*100);
    h+='<div class="card" style="padding:10px 14px">'+
      `<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:18px;font-weight:800">${medal} ${MOTOR_LBL[r.k]}</span><span style="font-size:17px;font-weight:800;color:var(--gold)">${accS}</span></div>`+
      `<div style="font-size:14px;color:var(--muted);margin-top:3px">✅ ${wf.hits[r.k]}/${wf.tot[r.k]} aciertos · peso en el consenso: ${w}%</div>`+
      '</div>';
  });
  // ---- Marcador honesto CONTRA el mercado (la casa) ----
  if(wf.mkt && wf.mkt.tot>0){
    const mAcc=(wf.mkt.hits/wf.mkt.tot*100).toFixed(1);
    const mBrier=(wf.mkt.brier/wf.mkt.tot).toFixed(3);
    // mejor motor por Brier (calidad de probabilidad, no solo acierto)
    let bestK=null,bestB=9;
    for(const k of MOTORES){ if(wf.tot[k]>=wf.mkt.tot*0.5){ const b=wf.brier[k]/wf.tot[k]; if(b<bestB){bestB=b;bestK=k;} } }
    const gana = bestK && bestB < parseFloat(mBrier);
    h+='<div class="stitle">🏛️ Nuestros motores vs la Casa</div>';
    h+='<div class="card" style="border-color:'+(gana?'rgba(32,192,90,.5)':'rgba(232,64,74,.4)')+';font-size:15px;line-height:1.6">'+
      '<div style="display:flex;justify-content:space-between"><b>🏛️ Mercado (cuota de cierre)</b><span style="font-weight:800">'+mAcc+'% · Brier '+mBrier+'</span></div>'+
      (bestK?('<div style="display:flex;justify-content:space-between;margin-top:4px"><b>'+MOTOR_LBL[bestK]+' (nuestro mejor)</b><span style="font-weight:800">'+(wf.hits[bestK]/wf.tot[bestK]*100).toFixed(1)+'% · Brier '+bestB.toFixed(3)+'</span></div>'):'')+
      '<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">'+
      (gana
        ? '✅ <b style="color:var(--green)">Por ahora le ganamos a la casa</b> en calidad de probabilidad (Brier menor = mejor). Muestra pequeña — puede cambiar.'
        : '⚖️ <b>La casa va adelante</b>, como era de esperarse — su cuota de cierre es muy difícil de superar. Esto es lo honesto: lo medimos en vez de prometerlo.')+
      '</div>'+
      '<div style="font-size:13px;color:var(--muted);margin-top:6px">Brier = qué tan buenas son las probabilidades (0 = perfecto, menor es mejor). Es la prueba justa: no basta acertar el ganador, hay que asignar bien la confianza.</div>'+
      '</div>';
  } else {
    h+='<div class="card" style="font-size:14px;color:var(--muted);line-height:1.5">🏛️ <b>Comparación vs la Casa:</b> aparece cuando haya partidos con cuotas de apuestas registradas. Ahí se ve, sin humo, si algún motor le gana al mercado (Brier) o no.</div>';
  }
  // Tarjeta del experimento de sobreajuste
  const anAcc=wf.tot.anomalia?(wf.hits.anomalia/wf.tot.anomalia*100).toFixed(1):null;
  h+=`<div class="card" style="border-color:rgba(240,188,53,.4);font-size:15px;line-height:1.6"><b>🌀 Experimento en curso — ¿transfiere el clon de la casa?</b><br>`+
    `<b>Paso 1 (hecho):</b> Anomalía entrenada con el Mundial 2026 — <b>${ANOM_MODEL.meta.accFinal}%</b> (${ANOM_MODEL.meta.partidos}/${ANOM_MODEL.meta.partidos}) en entrenamiento, 74 parámetros. Usa cuotas reales de la casa cuando existen.<br>`+
    `<b>Paso 2 (este torneo):</b> ${anAcc!==null?`va en <b>${anAcc}%</b> (${wf.hits.anomalia}/${wf.tot.anomalia}) fuera de muestra`:'esperando partidos'}. `+
    `Si se queda cerca del ELO o por debajo, el 100% del entrenamiento era memoria, no conocimiento.</div>`;
  if(wf.anom.n>=8){
    const favRate=wf.anom.favN?Math.round(wf.anom.favW/wf.anom.favN*100):0;
    const drawRate=Math.round(wf.anom.draws/wf.anom.n*100);
    h+=`<div class="card" style="font-size:15px;line-height:1.6"><b>🌀 Contexto del torneo</b><br>`+
      `Favoritos (ELO) ganando: <b>${favRate}%</b> de los partidos con ganador (base histórica ~${Math.round((cfg.baseFav||0.47)*100)}%)<br>`+
      `Empates: <b>${drawRate}%</b> (base ~${Math.round((cfg.baseDraw||0.26)*100)}%)</div>`;
  }
  // log partido a partido (últimos 20)
  const last=wf.log.slice(-20).reverse();
  if(last.length){
    h+='<div class="stitle">📋 Últimos partidos</div><div class="card" style="padding:8px 6px"><table class="mtab"><thead><tr><th>Partido</th>'+MOTORES.map(k=>'<th>'+MOTOR_SHORT[k]+'</th>').join('')+'<th>🏛️</th></tr></thead><tbody>';
    for(const r of last){
      h+='<tr><td style="font-size:12px">'+r.h.split(" ")[0]+' '+r.sh+'-'+r.sa+' '+r.a.split(" ")[0]+'</td>'+MOTORES.map(k=>'<td>'+(r.res[k]==null?'–':r.res[k]?'✅':'❌')+'</td>').join('')+'<td>'+(r.mkt==null?'–':r.mkt?'✅':'❌')+'</td></tr>';
    }
    h+='</tbody></table></div>';
  }
  pg.innerHTML=h;
}

// ==================== RELOJ Y BOOT ====================
function updateColTime(){
  const now=new Date();
  const utcMs=now.getTime()+now.getTimezoneOffset()*60000;
  const col=new Date(utcMs-5*3600000);
  const el=document.getElementById('colTime');
  if(el) el.textContent=`🕐 ${String(col.getHours()).padStart(2,'0')}:${String(col.getMinutes()).padStart(2,'0')} COL`;
}
setInterval(updateColTime,1000);
function setProgress(p,msg){
  document.getElementById('progFill').style.width=Math.min(100,p)+'%';
  document.getElementById('stepMsg').innerText=msg;
}
async function boot(){
  try{
    updateColTime();
    setProgress(15,'Cargando torneos…');
    renderTorneoBar();
    setProgress(40,'Restaurando datos guardados…');
    loadState(ACTIVE);
    setProgress(70,'Calibrando motores (walk-forward)…');
    getWF('betplay'); getWF('laliga');
    setProgress(100,'¡Listo!');
    document.getElementById('statusDot').className='sdot ok';
    document.getElementById('overlay').classList.add('gone');
    refreshAll();
    setTimeout(()=>syncActive(),800);
  }catch(e){
    document.getElementById('stepMsg').innerText='❌ Error: '+e.message;
    document.getElementById('overlay').classList.add('gone');
    console.error('boot:',e);
    try{ renderTorneoBar(); refreshAll(); }catch(ex){}
  }
}
boot();
</script>
